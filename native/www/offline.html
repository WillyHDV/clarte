<head>

  <title>Clarté sem conexão</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f6f2ee;color:#1d2433;font:16px/1.5 system-ui,sans-serif;text-align:center}

<body>
  <main>
    <h1>Sem conexão</h1>
    <p>O Clarté precisa de internet na primeira abertura. Depois de carregar uma vez, ele guarda os arquivos e abre mesmo sem rede.</p>
    <button onclick="location.href='https://willyhdv.github.io/clarte/'">Tentar de novo</button>
  </main>
